aid: retailnext
name: RetailNext
description: >-
  RetailNext is an AI-powered in-store retail analytics platform that helps
  physical retailers understand shopper behavior and optimize store operations.
  Its product suite spans traffic analytics (real-time foot-traffic counting and
  benchmarking across locations), shopper journey and zone insights (which
  layouts convert and where shoppers are lost), asset protection and loss
  prevention that combines video intelligence with shopper analytics, and Pulse
  AI, a conversational layer for answering retail questions in plain language.
  The platform is used by 600+ retailers across 100+ countries, including brands
  such as Macy's, Sephora, and Calvin Klein. RetailNext is a Battery Ventures
  portfolio company. It maintains a public GitHub organization of open-source
  infrastructure tooling and publishes a responsible-disclosure security program,
  but does not currently expose a publicly documented developer API or portal.
